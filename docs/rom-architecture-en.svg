<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="1900" viewBox="0 0 1520 1900">
  <desc>Android Custom ROM System-Level Offensive Platform: Overall Architecture and Attack Chains — academic black-and-white line diagram</desc>
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="8" refX="7.5" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,3 L0,6 Z" fill="#000"/>
    </marker>
    <marker id="arS" markerWidth="8" markerHeight="7" refX="6.5" refY="2.6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L7,2.6 L0,5.2 Z" fill="#000"/>
    </marker>
    <style>
      .box  { fill:none; stroke:#000000; stroke-width:1; }
      .box2 { fill:none; stroke:#000000; stroke-width:2.4; }
      .boxT { fill:none; stroke:#000000; stroke-width:1.5; }
      .sep  { stroke:#000000; stroke-width:0.8; stroke-dasharray:7 5; }
      .solid{ fill:none; stroke:#000000; stroke-width:1.5; }
      .thin { fill:none; stroke:#000000; stroke-width:1; }
      .dash { fill:none; stroke:#000000; stroke-width:1.1; stroke-dasharray:6 4; }
      .dot  { fill:none; stroke:#000000; stroke-width:1.2; stroke-dasharray:1.6 4.2; stroke-linecap:round; }
      .t1 { font:700 22px "Helvetica Neue",Arial,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif; fill:#000; }
      .ln { font:700 15px "Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif; fill:#000; }
      .hd { font:700 13px "Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif; fill:#000; }
      .bd { font:400 11px "Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif; fill:#000; }
      .it { font:400 12px "Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif; fill:#000; }
      .mo { font:400 10.5px "SF Mono",Menlo,Consolas,"Courier New",monospace; fill:#000; }
      .mi { font:400 12px "SF Mono",Menlo,Consolas,"Courier New",monospace; fill:#000; }
      .lb { font:400 10px "Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif; fill:#000; }
      .lm { font:400 10px "SF Mono",Menlo,Consolas,"Courier New",monospace; fill:#000; }
      .cb { font:700 15px "Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif; fill:#000; }
      .cr { font:400 13px "Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif; fill:#000; }
    </style>
  </defs>



  <!-- title -->
  <text x="760" y="52" text-anchor="middle" class="t1">Android Custom ROM System-Level Offensive Platform: Architecture &amp; Attack Chains</text>

  <!-- side column headers (vertical) -->
  <text x="26" y="745" text-anchor="middle" class="ln" transform="rotate(-90 26 745)">Control Entries</text>
  <text x="1498" y="745" text-anchor="middle" class="ln" transform="rotate(90 1498 745)">Data Exits</text>

  <!-- layer separators -->
  <line x1="176" y1="310" x2="1276" y2="310" class="sep"/>
  <line x1="176" y1="580" x2="1276" y2="580" class="sep"/>
  <line x1="176" y1="850" x2="1276" y2="850" class="sep"/>
  <line x1="176" y1="1100" x2="1276" y2="1100" class="sep"/>

  <!-- layer names (vertical, left strip) -->
  <text x="196" y="195" text-anchor="middle" class="ln" transform="rotate(-90 196 195)">App Layer</text>
  <text x="196" y="445" text-anchor="middle" class="ln" transform="rotate(-90 196 445)">Framework</text>
  <text x="196" y="715" text-anchor="middle" class="ln" transform="rotate(-90 196 715)">ART Runtime</text>
  <text x="196" y="975" text-anchor="middle" class="ln" transform="rotate(-90 196 975)">Native Libs</text>
  <text x="196" y="1255" text-anchor="middle" class="ln" transform="rotate(-90 196 1255)">Linux Kernel (msm-4.14)</text>

  <!-- ================= Layer 1 : App ================= -->
  <rect x="224" y="110" width="1052" height="170" class="box"/>
  <text x="244" y="140" class="hd" font-size="15">Target App Process</text>
  <text x="296" y="166" class="bd" font-weight="700">Detection probes (entry points)</text>
  <text x="296" y="190" class="mi">access("su")</text>
  <text x="296" y="212" class="mi">getdents("/dev")</text>
  <text x="296" y="234" class="mi">read TracerPid from /proc/self/status</text>
  <text x="296" y="256" class="mi">read SELinux policy file, compare hash</text>
  <text x="900" y="166" class="bd" font-weight="700">Affected entry points</text>
  <text x="900" y="190" class="it">Generates HTTPS traffic (OkHttp → Conscrypt)</text>
  <text x="900" y="212" class="it">Forked from Zygote</text>
  <!-- probe ports -->
  <circle cx="232" cy="186" r="1.8" fill="#000"/>
  <circle cx="248" cy="208" r="1.8" fill="#000"/>
  <circle cx="264" cy="230" r="1.8" fill="#000"/>
  <circle cx="280" cy="252" r="1.8" fill="#000"/>
  <line x1="232" y1="186" x2="290" y2="186" class="thin"/>
  <line x1="248" y1="208" x2="290" y2="208" class="thin"/>
  <line x1="264" y1="230" x2="290" y2="230" class="thin"/>
  <line x1="280" y1="252" x2="290" y2="252" class="thin"/>

  <!-- ================= Layer 2 : Framework ================= -->
  <rect x="320" y="340" width="296" height="210" class="box"/>
  <text x="332" y="364" class="hd">Pine Java Hook</text>
  <text x="332" y="384" class="mo">persist.pb.p3.* match pkg/process</text>
  <text x="332" y="400" class="mo">skip 32-bit processes</text>
  <text x="332" y="416" class="mo">setHiddenApiExemptions("L")</text>
  <text x="332" y="432" class="mo">ActivityThread</text>
  <text x="332" y="448" class="mo">  .handleBindApplication</text>
  <text x="332" y="464" class="mo">→ maybeLoadPbPine</text>
  <text x="332" y="480" class="mo">→ copy hooklogic.dex as</text>
  <text x="332" y="496" class="mo">  read-only staging copy</text>
  <text x="332" y="512" class="mo">→ Pine.ensureInitialized</text>
  <text x="332" y="528" class="mo">top.canyie.pin3 in boot classpath</text>

  <rect x="712" y="340" width="296" height="210" class="box"/>
  <text x="724" y="364" class="hd">Anti-Detection Spoofing</text>
  <text x="724" y="382" class="mo">build/make: ro.debuggable=0,</text>
  <text x="724" y="398" class="mo">  ro.build.type=user (build-time)</text>
  <text x="724" y="416" class="mo">SettingsProvider + Settings</text>
  <text x="724" y="432" class="mo">dual-channel for uid≥10000</text>
  <text x="724" y="448" class="mo">returns adb_enabled="0"</text>
  <text x="724" y="464" class="mo">PermissionManagerService</text>
  <text x="724" y="480" class="mo">hide FAKE_PACKAGE_SIGNATURE</text>
  <text x="724" y="496" class="mo">WindowState</text>
  <text x="724" y="512" class="mo">  .isSecureLocked()=false</text>

  <rect x="1010" y="340" width="296" height="210" class="box"/>
  <text x="1022" y="364" class="hd">Java Triggers (early / stable)</text>
  <text x="1022" y="386" class="mo">after attachBaseContext</text>
  <text x="1022" y="403" class="mo">  → early phase</text>
  <text x="1022" y="420" class="mo">after onCreate</text>
  <text x="1022" y="437" class="mo">  → stable phase</text>

  <!-- ================= Layer 3 : ART ================= -->
  <rect x="320" y="610" width="296" height="210" class="box"/>
  <text x="332" y="634" class="hd">Zygote Package Matching</text>
  <text x="332" y="656" class="mo">com_android_internal_os_Zygote.cpp</text>
  <text x="332" y="673" class="mo">PbSpawnState two-stage match:</text>
  <text x="332" y="690" class="mo">reverse pkg from app_data_dir</text>
  <text x="332" y="707" class="mo">+ narrow by process name</text>
  <text x="332" y="724" class="mo">skip system_server</text>
  <text x="332" y="741" class="mo">and child_zygote</text>

  <rect x="648" y="610" width="296" height="210" class="box"/>
  <text x="660" y="634" class="hd">Three-Phase Gadget Loader</text>
  <text x="660" y="656" class="mo">pb_agent.cc</text>
  <text x="660" y="673" class="mo">phases: zygote / early / stable</text>
  <text x="660" y="690" class="mo">PbBridgeContextV1 {</text>
  <text x="660" y="707" class="mo">  magic "PBV1",</text>
  <text x="660" y="724" class="mo">  JavaVM *vm,</text>
  <text x="660" y="741" class="mo">  package context ctx</text>
  <text x="660" y="758" class="mo">}</text>

  <rect x="1010" y="610" width="296" height="210" class="box"/>
  <text x="1022" y="634" class="hd">Unpacking</text>
  <text x="1022" y="656" class="mo">zygote phase in place before</text>
  <text x="1022" y="673" class="mo">packer decrypts dex</text>
  <text x="1022" y="690" class="mo">→ dump original dex</text>
  <text x="1022" y="710" class="lb" font-style="italic">(use case of Gadget loader</text>
  <text x="1022" y="724" class="lb" font-style="italic">  zygote phase)</text>

  <!-- ================= Layer 4 : Native ================= -->
  <rect x="320" y="880" width="460" height="190" class="box"/>
  <text x="332" y="904" class="hd">Conscrypt / BoringSSL</text>
  <text x="332" y="926" class="mo">native_crypto.cc</text>
  <text x="332" y="943" class="mo">SSL_CTX_new registers keylog cb</text>
  <text x="332" y="960" class="mo">→ debug_print_session_key</text>
  <text x="332" y="977" class="mo">(filtered by uid, default off)</text>
  <text x="332" y="994" class="mo">session keys exported via keylog cb</text>

  <rect x="816" y="880" width="460" height="190" class="box"/>
  <text x="828" y="904" class="hd">adbd Privilege Escalation</text>
  <text x="828" y="926" class="mo">restart_service.cpp: remove ro.debuggable gate</text>
  <text x="828" y="944" class="mo">main.cpp: ro_debuggable hardcoded true,</text>
  <text x="828" y="962" class="mo">  should_drop_caps forced false</text>
  <text x="828" y="980" class="mo">sockets.cpp: root service check removed,</text>
  <text x="828" y="998" class="mo">  property renamed service.adb.pb</text>
  <text x="828" y="1016" class="mo">fs_mgr_remount.cpp: bypass verifiedbootstate</text>
  <text x="828" y="1034" class="mo">  check, adb remount usable</text>

  <!-- ================= Layer 5 : Kernel ================= -->
  <rect x="224" y="1180" width="248" height="200" class="box"/>
  <text x="236" y="1204" class="hd">Path Resolution</text>
  <text x="236" y="1222" class="mo" font-weight="700">fs/namei.c</text>
  <text x="236" y="1240" class="mo">filename_lookup：</text>
  <text x="236" y="1257" class="mo">uid≥10000 accessing</text>
  <text x="236" y="1274" class="mo">su / adbd socket /</text>
  <text x="236" y="1291" class="mo">/dev/pts/*</text>
  <text x="236" y="1308" class="mo">→ return ENOENT</text>

  <rect x="492" y="1180" width="248" height="200" class="box"/>
  <text x="504" y="1204" class="hd">Directory Enumeration</text>
  <text x="504" y="1222" class="mo" font-weight="700">fs/readdir.c</text>
  <text x="504" y="1240" class="mo">filldir / filldir64 /</text>
  <text x="504" y="1257" class="mo">compat_filldir</text>
  <text x="504" y="1274" class="mo">skip pts entries</text>

  <rect x="760" y="1180" width="248" height="200" class="box"/>
  <text x="772" y="1204" class="hd">Anti-Debug</text>
  <text x="772" y="1222" class="mo" font-weight="700">fs/proc/array.c</text>
  <text x="772" y="1240" class="mo">TracerPid always 0</text>

  <rect x="1028" y="1180" width="248" height="200" class="box"/>
  <text x="1040" y="1204" class="hd" font-size="12.5">SELinux Shadowing</text>
  <text x="1040" y="1222" class="mo" font-weight="700">fs/namei.c</text>
  <text x="1040" y="1240" class="mo">vendor_sepolicy.cil</text>
  <text x="1040" y="1257" class="mo">redirect to .se_clean copy</text>
  <text x="1040" y="1274" class="mo">except: init / ueventd / vold</text>
  <text x="1040" y="1298" class="mo" font-weight="700">nlmsgtab.c</text>
  <text x="1040" y="1316" class="mo">keep RTM_GETLINK behind</text>
  <text x="1040" y="1333" class="mo">NLMSG_READPRIV</text>

  <!-- ================= Left control column ================= -->
  <rect x="34" y="770" width="130" height="50" class="box"/>
  <text x="45" y="790" class="lm">pb-gadget &lt;pkg&gt;</text>
  <text x="45" y="806" class="lm">[--early|--zygote]</text>

  <rect x="34" y="660" width="130" height="50" class="box"/>
  <text x="45" y="680" class="lm">pb-pine &lt;pkg&gt;</text>
  <text x="45" y="696" class="lm">[--debug|--all]</text>

  <rect x="34" y="880" width="130" height="54" class="box"/>
  <text x="45" y="898" class="lm">setprop</text>
  <text x="45" y="914" class="lm">debug.conscrypt.</text>
  <text x="45" y="930" class="lm">sslkeylog.uid</text>

  <!-- ================= Right data column ================= -->
  <rect x="1326" y="740" width="150" height="40" class="box"/>
  <text x="1401" y="765" text-anchor="middle" class="mi">dump.pcap</text>

  <rect x="1290" y="900" width="150" height="40" class="box"/>
  <text x="1365" y="925" text-anchor="middle" class="bd">logcat filter + sed</text>

  <rect x="1290" y="965" width="150" height="40" class="box"/>
  <text x="1365" y="990" text-anchor="middle" class="mi">sslkeylog.txt</text>

  <rect x="1290" y="1090" width="150" height="40" class="box"/>
  <text x="1365" y="1108" text-anchor="middle" class="hd" font-size="12">Wireshark</text>
  <text x="1365" y="1124" text-anchor="middle" class="lb" font-size="9">keylog + pcap decryption</text>

  <rect x="1290" y="1180" width="150" height="40" class="boxT"/>
  <text x="1365" y="1205" text-anchor="middle" class="hd" font-size="12.5">Plaintext HTTP</text>

  <!-- ================= Edges : A injection chain ================= -->
  <path d="M164,795 H320" class="dash" marker-end="url(#arS)"/>
  <path d="M164,685 H212 V380 H320" class="dash" marker-end="url(#arS)"/>
  <path d="M616,700 H648" class="solid" marker-end="url(#ar)"/>
  <path d="M672,610 V278" class="solid" marker-end="url(#ar)"/>
  <path d="M1084,550 V576 H920 V610" class="dash" marker-end="url(#arS)"/>
  <path d="M1010,715 H944" class="thin" marker-end="url(#arS)"/>

  <!-- ================= Edges : B TLS data flow ================= -->
  <!-- B1: App HTTPS → Conscrypt（straight down） -->
  <path d="M700,280 V296 H634 V872 H700 V880" class="dot" marker-end="url(#arS)"/>
  <!-- B2: Conscrypt exit right → logcat filter（sslkeylog chain） -->
  <path d="M550,880 V866 H1380 V900" class="dot" marker-end="url(#arS)"/>
  <!-- B3: logcat filter → sslkeylog.txt -->
  <path d="M1365,940 V965" class="thin" marker-end="url(#arS)"/>
  <!-- B4: sslkeylog.txt → Wireshark（top-down entry） -->
  <path d="M1365,1005 V1090" class="thin" marker-end="url(#arS)"/>
  <!-- B5: App HTTPS ciphertext → PCAPdroid → dump.pcap（passive capture chain） -->
  <path d="M1276,268 H1361 V740" class="dot" marker-end="url(#arS)"/>
  <!-- B6: dump.pcap → Wireshark（route down right edge，enter from left Wireshark right side） -->
  <path d="M1476,760 H1480 V1110 H1440" class="dot" marker-end="url(#arS)"/>
  <!-- B7: Wireshark → Plaintext HTTP -->
  <path d="M1365,1130 V1180" class="thin" marker-end="url(#arS)"/>

  <!-- ================= Edges : C anti-detection ================= -->
  <path d="M232,186 V1166 H348 V1180" class="thin" marker-end="url(#arS)"/>
  <path d="M248,208 V1154 H616 V1180" class="thin" marker-end="url(#arS)"/>
  <path d="M264,230 V1142 H884 V1180" class="thin" marker-end="url(#arS)"/>
  <path d="M280,252 V1126 H1152 V1180" class="thin" marker-end="url(#arS)"/>
  <path d="M860,340 V280" class="thin" marker-end="url(#arS)"/>
  <path d="M872,280 V340" class="thin" marker-end="url(#arS)"/>
  <!-- forged-value loop-back arrows -->
  <path d="M357,1180 V1166" class="thin" marker-end="url(#arS)"/>
  <path d="M625,1180 V1154" class="thin" marker-end="url(#arS)"/>
  <path d="M893,1180 V1142" class="thin" marker-end="url(#arS)"/>
  <path d="M1161,1180 V1126" class="thin" marker-end="url(#arS)"/>

  <!-- setprop dashed edge -->
  <path d="M164,907 H320" class="dash" marker-end="url(#arS)"/>


  <!-- ================= Edge labels ================= -->
  <text x="250" y="787" text-anchor="middle" class="lm">write persist.pb.*</text>
  <text x="99" y="648" text-anchor="middle" class="lm" font-size="9">write persist.pb.p3.*</text>
  <text x="802" y="597" text-anchor="middle" class="lm">JNI bridge nativeUpdateAndroidPbState</text>
  <text x="660" y="450" text-anchor="middle" class="lm" font-size="9.5" transform="rotate(-90 660 450)">dlopen libandroid_pb_v1.so</text>
  <text x="684" y="450" text-anchor="middle" class="lm" font-size="9.5" transform="rotate(-90 684 450)">load agent.js, pb-gadget active</text>
  <text x="985" y="566" text-anchor="middle" class="lm">nativeMaybeLoadAndroidPb{Zygote|Early|Stable}</text>
  <text x="664" y="860" text-anchor="middle" class="lm">SSLSocket/OkHttp</text>
  <text x="960" y="862" text-anchor="middle" class="lm">logcat: SSLKEY: uid/pid/pkg || keylog line</text>
  <text x="1286" y="260" class="lb">PCAPdroid local VPN</text>
  <text x="1468" y="940" text-anchor="middle" class="lb" font-size="9.5" transform="rotate(-90 1468 940)">import dump.pcap</text>
  <text x="242" y="899" text-anchor="middle" class="lb">enable by uid</text>
  <text x="812" y="300" class="lm">ro.debuggable=0 / adb_enabled=0 (dual-channel)</text>
  <text x="1373" y="958" class="lb" font-size="9.5">filter / extract</text>
  <text x="1373" y="1050" class="lb" font-size="9.5">import</text>
  <text x="1373" y="1160" class="lb" font-size="9.5">output</text>
  <text x="365" y="1136" class="lb">return ENOENT (indistinguishable from absent)</text>
  <text x="633" y="1124" class="lb">no pts entries enumerated</text>
  <text x="901" y="1112" class="lb">always 0</text>
  <text x="1143" y="1112" text-anchor="end" class="lb">return clean copy, hash check passes</text>

  <!-- ================= Conclusion ================= -->
  <rect x="24" y="1420" width="1446" height="105" class="box2"/>
  <text x="747" y="1456" text-anchor="middle" class="cb">Attack surface becomes intrinsic system behavior: no files, no ports, no processes, no maps traces.</text>
  <text x="747" y="1484" text-anchor="middle" class="cr">Kernel / ART / Framework / Native four-layer source customization</text>
  <text x="747" y="1508" text-anchor="middle" class="lm" font-size="9.5">Layout: /system_ext/bin/{pb-gadget,pb-pine}  /system_ext/lib64/{libandroid_pb_v1.so,libpin3.so}  vendor/pb/*</text>

