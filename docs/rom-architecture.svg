<svg width="1520" height="1900" viewBox="0 0 1520 1900" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" overflow="hidden"><defs><marker refX="7.5" refY="3" markerWidth="9" markerHeight="8" orient="auto" id="ar" overflow="hidden"><path d="M0 0 8 3 0 6Z" fill="#000000"/></marker><marker refX="6.5" refY="2.6" markerWidth="8" markerHeight="7" orient="auto" id="arS" overflow="hidden"><path d="M0 0 7 2.6 0 5.2Z" fill="#000000"/></marker></defs><text fill="#000000" text-anchor="middle" x="760" y="52">Android 定制 ROM 系统级攻防平台：总体架构与攻击链路</text><text fill="#000000" text-anchor="middle" transform="matrix(6.12323e-17 -1 1 6.12323e-17 -719 771)" x="26" y="745">控制入口</text><text fill="#000000" text-anchor="middle" transform="matrix(6.12323e-17 1 -1 6.12323e-17 2243 -753)" x="1498" y="745">数据出口</text><line x1="176" y1="310" x2="1276" y2="310" stroke="#000000" stroke-width="0.8" stroke-dasharray="7 5"/><line x1="176" y1="580" x2="1276" y2="580" stroke="#000000" stroke-width="0.8" stroke-dasharray="7 5"/><line x1="176" y1="850" x2="1276" y2="850" stroke="#000000" stroke-width="0.8" stroke-dasharray="7 5"/><line x1="176" y1="1100" x2="1276" y2="1100" stroke="#000000" stroke-width="0.8" stroke-dasharray="7 5"/><text fill="#000000" text-anchor="middle" transform="matrix(6.12323e-17 -1 1 6.12323e-17 1 391)" x="196" y="195">应用层</text><text fill="#000000" text-anchor="middle" transform="matrix(6.12323e-17 -1 1 6.12323e-17 -249 641)" x="196" y="445">Framework 层</text><text fill="#000000" text-anchor="middle" transform="matrix(6.12323e-17 -1 1 6.12323e-17 -519 911)" x="196" y="715">ART 运行时层</text><text fill="#000000" text-anchor="middle" transform="matrix(6.12323e-17 -1 1 6.12323e-17 -779 1171)" x="196" y="975">Native 库层</text><text fill="#000000" text-anchor="middle" transform="matrix(6.12323e-17 -1 1 6.12323e-17 -1059 1451)" x="196" y="1255">Linux 内核层（msm-4.14）</text><rect x="224" y="110" width="1052" height="170" stroke="#000000" stroke-width="1" fill="none"/><text fill="#000000" font-size="15" x="244" y="140">目标 App 进程</text><text fill="#000000" font-weight="700" x="296" y="166">检测动作（探测入口）</text><text fill="#000000" x="296" y="190">access("su")</text><text fill="#000000" x="296" y="212">getdents("/dev")</text><text fill="#000000" x="296" y="234">读 /proc/self/status 的 TracerPid</text><text fill="#000000" x="296" y="256">读 SELinux 策略文件比对哈希</text><text fill="#000000" font-weight="700" x="900" y="166">被作用入口</text><text fill="#000000" x="900" y="190">产生 HTTPS 流量（OkHttp → Conscrypt）</text><text fill="#000000" x="900" y="212">由 Zygote fork 而来</text><circle cx="232" cy="186" r="1.8" fill="#000000"/><circle cx="248" cy="208" r="1.8" fill="#000000"/><circle cx="264" cy="230" r="1.8" fill="#000000"/><circle cx="280" cy="252" r="1.8" fill="#000000"/><line x1="232" y1="186" x2="290" y2="186" stroke="#000000" stroke-width="1" fill="none"/><line x1="248" y1="208" x2="290" y2="208" stroke="#000000" stroke-width="1" fill="none"/><line x1="264" y1="230" x2="290" y2="230" stroke="#000000" stroke-width="1" fill="none"/><line x1="280" y1="252" x2="290" y2="252" stroke="#000000" stroke-width="1" fill="none"/><rect x="320" y="340" width="296" height="210" stroke="#000000" stroke-width="1" fill="none"/><text fill="#000000" x="332" y="364">Pine Java Hook</text><text fill="#000000" x="332" y="384">persist.pb.p3.* 匹配包/进程</text><text fill="#000000" x="332" y="400">跳过 32 位进程</text><text fill="#000000" x="332" y="416">setHiddenApiExemptions("L")</text><text fill="#000000" x="332" y="432">ActivityThread</text><text fill="#000000" x="332" y="448">.handleBindApplication</text><text fill="#000000" x="332" y="464">→ maybeLoadPbPine</text><text fill="#000000" x="332" y="480">→ hooklogic.dex 复制为</text><text fill="#000000" x="332" y="496">只读副本</text><text fill="#000000" x="332" y="512">→ Pine.ensureInitialized</text><text fill="#000000" x="332" y="528">top.canyie.pin3 编入 boot classpath</text><rect x="712" y="340" width="296" height="210" stroke="#000000" stroke-width="1" fill="none"/><text fill="#000000" x="724" y="364">反检测伪装</text><text fill="#000000" x="724" y="382">build/make: ro.debuggable=0,</text><text fill="#000000" x="724" y="398">ro.build.type=user（构建期）</text><text fill="#000000" x="724" y="416">SettingsProvider + Settings</text><text fill="#000000" x="724" y="432">双通道对 uid≥10000</text><text fill="#000000" x="724" y="448">返回 adb_enabled="0"</text><text fill="#000000" x="724" y="464">PermissionManagerService</text><text fill="#000000" x="724" y="480">隐藏 FAKE_PACKAGE_SIGNATURE</text><text fill="#000000" x="724" y="496">WindowState</text><text fill="#000000" x="724" y="512">.isSecureLocked()=false</text><rect x="1010" y="340" width="296" height="210" stroke="#000000" stroke-width="1" fill="none"/><text fill="#000000" x="1022" y="364">Java 触发点（early / stable）</text><text fill="#000000" x="1022" y="386">attachBaseContext 后</text><text fill="#000000" x="1022" y="403">→ early 相位</text><text fill="#000000" x="1022" y="420">onCreate 后</text><text fill="#000000" x="1022" y="437">→ stable 相位</text><rect x="320" y="610" width="296" height="210" stroke="#000000" stroke-width="1" fill="none"/><text fill="#000000" x="332" y="634">Zygote 包名匹配</text><text fill="#000000" x="332" y="656">com_android_internal_os_Zygote.cpp</text><text fill="#000000" x="332" y="673">PbSpawnState 两段式匹配：</text><text fill="#000000" x="332" y="690">app_data_dir 反推包名</text><text fill="#000000" x="332" y="707">+ 进程名收窄</text><text fill="#000000" x="332" y="724">跳过 system_server</text><text fill="#000000" x="332" y="741">与 child_zygote</text><rect x="648" y="610" width="296" height="210" stroke="#000000" stroke-width="1" fill="none"/><text fill="#000000" x="660" y="634">三相位 Gadget 加载器</text><text fill="#000000" x="660" y="656">pb_agent.cc</text><text fill="#000000" x="660" y="673">相位：zygote / early / stable</text><text fill="#000000" x="660" y="690">PbBridgeContextV1 {</text><text fill="#000000" x="660" y="707">magic "PBV1",</text><text fill="#000000" x="660" y="724">JavaVM *vm,</text><text fill="#000000" x="660" y="741">包上下文 ctx</text><text fill="#000000" x="660" y="758">}</text><rect x="1010" y="610" width="296" height="210" stroke="#000000" stroke-width="1" fill="none"/><text fill="#000000" x="1022" y="634">脱壳</text><text fill="#000000" x="1022" y="656">zygote 相位于壳解密</text><text fill="#000000" x="1022" y="673">dex 前就位</text><text fill="#000000" x="1022" y="690">→ dump 原始 dex</text><text fill="#000000" font-style="italic" x="1022" y="710">（Gadget 加载器</text><text fill="#000000" font-style="italic" x="1022" y="724">zygote 相位用法）</text><rect x="320" y="880" width="460" height="190" stroke="#000000" stroke-width="1" fill="none"/><text fill="#000000" x="332" y="904">Conscrypt / BoringSSL</text><text fill="#000000" x="332" y="926">native_crypto.cc</text><text fill="#000000" x="332" y="943">SSL_CTX_new 注册 keylog 回调</text><text fill="#000000" x="332" y="960">→ debug_print_session_key</text><text fill="#000000" x="332" y="977">（按 uid 过滤，默认关闭）</text><text fill="#000000" x="332" y="994">会话密钥经 keylog 回调导出</text><rect x="816" y="880" width="460" height="190" stroke="#000000" stroke-width="1" fill="none"/><text fill="#000000" x="828" y="904">adbd 提权</text><text fill="#000000" x="828" y="926">restart_service.cpp: 移除 ro.debuggable 门槛</text><text fill="#000000" x="828" y="944">main.cpp: ro_debuggable 硬编码 true,</text><text fill="#000000" x="828" y="962">should_drop_caps 强制 false</text><text fill="#000000" x="828" y="980">sockets.cpp: root 服务移除判定,</text><text fill="#000000" x="828" y="998">属性改名 service.adb.pb</text><text fill="#000000" x="828" y="1016">fs_mgr_remount.cpp: 绕过 verifiedbootstate</text><text fill="#000000" x="828" y="1034">检查, adb remount 可用</text><rect x="224" y="1180" width="248" height="200" stroke="#000000" stroke-width="1" fill="none"/><text fill="#000000" x="236" y="1204">路径解析</text><text fill="#000000" font-weight="700" x="236" y="1222">fs/namei.c</text><text fill="#000000" x="236" y="1240">filename_lookup：</text><text fill="#000000" x="236" y="1257">uid≥10000 访问</text><text fill="#000000" x="236" y="1274">su / adbd socket /</text><text fill="#000000" x="236" y="1291">/dev/pts/*</text><text fill="#000000" x="236" y="1308">→ 返回 ENOENT</text><rect x="492" y="1180" width="248" height="200" stroke="#000000" stroke-width="1" fill="none"/><text fill="#000000" x="504" y="1204">目录枚举</text><text fill="#000000" font-weight="700" x="504" y="1222">fs/readdir.c</text><text fill="#000000" x="504" y="1240">filldir / filldir64 /</text><text fill="#000000" x="504" y="1257">compat_filldir</text><text fill="#000000" x="504" y="1274">跳过 pts 条目</text><rect x="760" y="1180" width="248" height="200" stroke="#000000" stroke-width="1" fill="none"/><text fill="#000000" x="772" y="1204">反调试</text><text fill="#000000" font-weight="700" x="772" y="1222">fs/proc/array.c</text><text fill="#000000" x="772" y="1240">TracerPid 恒报 0</text><rect x="1028" y="1180" width="248" height="200" stroke="#000000" stroke-width="1" fill="none"/><text fill="#000000" font-size="12.5" x="1040" y="1204">SELinux Shadowing</text><text fill="#000000" font-weight="700" x="1040" y="1222">fs/namei.c</text><text fill="#000000" x="1040" y="1240">vendor_sepolicy.cil</text><text fill="#000000" x="1040" y="1257">重定向至 .se_clean 副本</text><text fill="#000000" x="1040" y="1274">例外：init / ueventd / vold</text><text fill="#000000" font-weight="700" x="1040" y="1298">nlmsgtab.c</text><text fill="#000000" x="1040" y="1316">保持 RTM_GETLINK</text><text fill="#000000" x="1040" y="1333">需 NLMSG_READPRIV</text><rect x="34" y="770" width="130" height="50" stroke="#000000" stroke-width="1" fill="none"/><text fill="#000000" x="45" y="790">pb-gadget &lt;pkg&gt;</text><text fill="#000000" x="45" y="806">[--early|--zygote]</text><rect x="34" y="660" width="130" height="50" stroke="#000000" stroke-width="1" fill="none"/><text fill="#000000" x="45" y="680">pb-pine &lt;pkg&gt;</text><text fill="#000000" x="45" y="696">[--debug|--all]</text><rect x="34" y="880" width="130" height="54" stroke="#000000" stroke-width="1" fill="none"/><text fill="#000000" x="45" y="898">setprop</text><text fill="#000000" x="45" y="914">debug.conscrypt.</text><text fill="#000000" x="45" y="930">sslkeylog.uid</text><rect x="1326" y="740" width="150" height="40" stroke="#000000" stroke-width="1" fill="none"/><text fill="#000000" text-anchor="middle" x="1401" y="765">dump.pcap</text><rect x="1290" y="900" width="150" height="40" stroke="#000000" stroke-width="1" fill="none"/><text fill="#000000" text-anchor="middle" x="1365" y="925">logcat 过滤 + sed</text><rect x="1290" y="965" width="150" height="40" stroke="#000000" stroke-width="1" fill="none"/><text fill="#000000" text-anchor="middle" x="1365" y="990">sslkeylog.txt</text><rect x="1290" y="1090" width="150" height="40" stroke="#000000" stroke-width="1" fill="none"/><text fill="#000000" font-size="12" text-anchor="middle" x="1365" y="1108">Wireshark</text><text fill="#000000" font-size="9" text-anchor="middle" x="1365" y="1124">keylog + pcap 解密</text><rect x="1290" y="1180" width="150" height="40" stroke="#000000" stroke-width="1.5" fill="none"/><text fill="#000000" font-size="12.5" text-anchor="middle" x="1365" y="1205">明文 HTTP</text><path d="M164 795 320 795" stroke="#000000" stroke-width="1.1" stroke-dasharray="6 4" fill="none" marker-end="url(#arS)"/><path d="M164 685 212 685 212 380 320 380" stroke="#000000" stroke-width="1.1" stroke-dasharray="6 4" fill="none" marker-end="url(#arS)"/><path d="M616 700 648 700" stroke="#000000" stroke-width="1.5" fill="none" marker-end="url(#ar)"/><path d="M672 610 672 278" stroke="#000000" stroke-width="1.5" fill="none" marker-end="url(#ar)"/><path d="M1084 550 1084 576 920 576 920 610" stroke="#000000" stroke-width="1.1" stroke-dasharray="6 4" fill="none" marker-end="url(#arS)"/><path d="M1010 715 944 715" stroke="#000000" stroke-width="1" fill="none" marker-end="url(#arS)"/><path d="M700 280 700 296 634 296 634 872 700 872 700 880" stroke="#000000" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="1.6 4.2" fill="none" marker-end="url(#arS)"/><path d="M550 880 550 866 1380 866 1380 900" stroke="#000000" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="1.6 4.2" fill="none" marker-end="url(#arS)"/><path d="M1365 940 1365 965" stroke="#000000" stroke-width="1" fill="none" marker-end="url(#arS)"/><path d="M1365 1005 1365 1090" stroke="#000000" stroke-width="1" fill="none" marker-end="url(#arS)"/><path d="M1276 268 1361 268 1361 740" stroke="#000000" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="1.6 4.2" fill="none" marker-end="url(#arS)"/><path d="M1476 760 1480 760 1480 1110 1440 1110" stroke="#000000" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="1.6 4.2" fill="none" marker-end="url(#arS)"/><path d="M1365 1130 1365 1180" stroke="#000000" stroke-width="1" fill="none" marker-end="url(#arS)"/><path d="M232 186 232 1166 348 1166 348 1180" stroke="#000000" stroke-width="1" fill="none" marker-end="url(#arS)"/><path d="M248 208 248 1154 616 1154 616 1180" stroke="#000000" stroke-width="1" fill="none" marker-end="url(#arS)"/><path d="M264 230 264 1142 884 1142 884 1180" stroke="#000000" stroke-width="1" fill="none" marker-end="url(#arS)"/><path d="M280 252 280 1126 1152 1126 1152 1180" stroke="#000000" stroke-width="1" fill="none" marker-end="url(#arS)"/><path d="M860 340 860 280" stroke="#000000" stroke-width="1" fill="none" marker-end="url(#arS)"/><path d="M872 280 872 340" stroke="#000000" stroke-width="1" fill="none" marker-end="url(#arS)"/><path d="M357 1180 357 1166" stroke="#000000" stroke-width="1" fill="none" marker-end="url(#arS)"/><path d="M625 1180 625 1154" stroke="#000000" stroke-width="1" fill="none" marker-end="url(#arS)"/><path d="M893 1180 893 1142" stroke="#000000" stroke-width="1" fill="none" marker-end="url(#arS)"/><path d="M1161 1180 1161 1126" stroke="#000000" stroke-width="1" fill="none" marker-end="url(#arS)"/><path d="M164 907 320 907" stroke="#000000" stroke-width="1.1" stroke-dasharray="6 4" fill="none" marker-end="url(#arS)"/><text fill="#000000" text-anchor="middle" x="250" y="787">写 persist.pb.*</text><text fill="#000000" font-size="9" text-anchor="middle" x="99" y="648">写 persist.pb.p3.*</text><text fill="#000000" text-anchor="middle" x="802" y="597">JNI 桥 nativeUpdateAndroidPbState</text><text fill="#000000" font-size="9.5" text-anchor="middle" transform="matrix(6.12323e-17 -1 1 6.12323e-17 210 1110)" x="660" y="450">dlopen libandroid_pb_v1.so</text><text fill="#000000" font-size="9.5" text-anchor="middle" transform="matrix(6.12323e-17 -1 1 6.12323e-17 234 1134)" x="684" y="450">加载 agent.js，pb-gadget 生效</text><text fill="#000000" text-anchor="middle" x="985" y="566">nativeMaybeLoadAndroidPb{Zygote|Early|Stable}</text><text fill="#000000" text-anchor="middle" x="664" y="860">SSLSocket/OkHttp</text><text fill="#000000" text-anchor="middle" x="960" y="862">logcat: SSLKEY: uid/pid/pkg || keylog 行</text><text fill="#000000" x="1286" y="260">PCAPdroid 本地 VPN</text><text fill="#000000" font-size="9.5" text-anchor="middle" transform="matrix(6.12323e-17 -1 1 6.12323e-17 528 2408)" x="1468" y="940">导入 dump.pcap</text><text fill="#000000" text-anchor="middle" x="242" y="899">按 uid 开启</text><text fill="#000000" x="812" y="300">ro.debuggable=0 / adb_enabled=0（双通道）</text><text fill="#000000" font-size="9.5" x="1373" y="958">过滤 / 提取</text><text fill="#000000" font-size="9.5" x="1373" y="1050">导入</text><text fill="#000000" font-size="9.5" x="1373" y="1160">输出</text><text fill="#000000" x="365" y="1136">返回 ENOENT（与不存在不可区分）</text><text fill="#000000" x="633" y="1124">枚举无 pts 条目</text><text fill="#000000" x="901" y="1112">恒 0</text><text fill="#000000" text-anchor="end" x="1143" y="1112">返回干净副本，校验通过</text><rect x="24" y="1420" width="1446" height="105" stroke="#000000" stroke-width="2.4" fill="none"/><text fill="#000000" text-anchor="middle" x="747" y="1456">攻击面成为系统固有行为：无文件 · 无端口 · 无进程 · 无 maps 痕迹。</text><text fill="#000000" text-anchor="middle" x="747" y="1484">内核 / ART / Framework / Native 四层源码定制化</text><text fill="#000000" font-size="9.5" text-anchor="middle" x="747" y="1508">组件布局：/system_ext/bin/{pb-gadget,pb-pine} /system_ext/lib64/{libandroid_pb_v1.so,libpin3.so} vendor/pb/*</text><rect x="1130" y="1600" width="340" height="190" stroke="#000000" stroke-width="1" fill="none"/><text fill="#000000" x="1150" y="1632">图例</text><line x1="1150" y1="1656" x2="1200" y2="1656" stroke="#000000" stroke-width="1.5" fill="none" marker-end="url(#ar)"/><text fill="#000000" x="1212" y="1660">实线箭头：运行时调用 / 控制流</text><line x1="1150" y1="1688" x2="1200" y2="1688" stroke="#000000" stroke-width="1.1" stroke-dasharray="6 4" fill="none" marker-end="url(#arS)"/><text fill="#000000" x="1212" y="1692">虚线箭头：系统属性写入 / 读取</text><line x1="1150" y1="1720" x2="1200" y2="1720" stroke="#000000" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="1.6 4.2" fill="none" marker-end="url(#arS)"/><text fill="#000000" x="1212" y="1724">点线箭头：数据流</text><path d="M1160 1740 1160 1764" stroke="#000000" stroke-width="1" fill="none" marker-end="url(#arS)"/><path d="M1175 1764 1175 1740" stroke="#000000" stroke-width="1" fill="none" marker-end="url(#arS)"/><text fill="#000000" x="1212" y="1756">回环箭头：对应用返回的伪造值</text></svg>