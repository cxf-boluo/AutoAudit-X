<svg width="1520" height="1520" viewBox="0 0 1520 1520" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" overflow="hidden"><defs><marker refX="7.5" refY="3" markerWidth="9" markerHeight="8" orient="auto" id="ar" overflow="hidden"><path d="M0 0 8 3 0 6Z" fill="#000000"/></marker></defs><text fill="#000000" text-anchor="middle" x="760" y="52">AX 总体架构：智能体层 + 并列支撑（ROM · 协作区 · 硬件）</text><rect x="60" y="90" width="1400" height="560" stroke="#000000" stroke-width="1.6" fill="none"/><text fill="#000000" text-anchor="middle" transform="matrix(6.12323e-17 -1 1 6.12323e-17 -284 456)" x="86" y="370">智能体层 Agent Layer</text><rect x="140" y="120" width="1280" height="80" stroke="#000000" stroke-width="1" fill="none"/><text fill="#000000" x="156" y="152">Brain (Orchestrator)</text><text fill="#000000" x="156" y="180">池调度 / 资源仲裁 / 反思复盘</text><rect x="140" y="220" width="600" height="120" stroke="#000000" stroke-width="1" fill="none"/><text fill="#000000" x="156" y="248">recon <tspan fill="#000000" font-weight="400">（前置侦察，单实例串行）</tspan></text><text fill="#000000" x="156" y="276">加固识别 → HookLogic-X 脱壳 + 反编译</text><text fill="#000000" x="156" y="300">产出：目标画像 / 攻击面清单</text><rect x="780" y="220" width="640" height="300" stroke="#000000" stroke-width="1" fill="none"/><text fill="#000000" x="796" y="248">vuln_agent × N <tspan fill="#000000" font-weight="400">（弹性 worker 池）</tspan></text><text fill="#000000" x="796" y="272">每 worker 配对独立 toolkit 实例</text><rect x="810" y="290" width="580" height="48" stroke="#000000" stroke-width="1" fill="none"/><text fill="#000000" x="824" y="310">toolkit.cve_scan</text><text fill="#000000" x="824" y="328">CVE 离线库 + 线上搜索</text><rect x="810" y="348" width="580" height="48" stroke="#000000" stroke-width="1" fill="none"/><text fill="#000000" x="824" y="368">toolkit.traffic_audit</text><text fill="#000000" x="824" y="386">TLS 密钥导出 + 业务层解密</text><rect x="810" y="406" width="580" height="48" stroke="#000000" stroke-width="1" fill="none"/><text fill="#000000" x="824" y="426">toolkit.phone_automation<tspan fill="#000000">［互斥］</tspan></text><text fill="#000000" x="824" y="444">adb + UI Automator</text><rect x="810" y="464" width="580" height="48" stroke="#000000" stroke-width="1" fill="none"/><text fill="#000000" x="824" y="484">toolkit.ble_control<tspan fill="#000000">［互斥］</tspan></text><text fill="#000000" x="824" y="502">SDR + nRF52840 / Bumble</text><rect x="140" y="360" width="600" height="160" stroke="#000000" stroke-width="1" fill="none"/><text fill="#000000" x="156" y="388">verify <tspan fill="#000000" font-weight="400">（每组件独立实例）</tspan></text><text fill="#000000" x="156" y="414">三层隔离：信息 / 视角 / 模型</text><text fill="#000000" x="156" y="440">对 vuln_agent 结论独立复核</text><text fill="#000000" x="156" y="462">屏蔽原始推理轨迹，仅看证据</text><text fill="#000000" x="156" y="484">防止确认偏误与循环论证</text><path d="M440 200 440 218" stroke="#000000" stroke-width="1.5" fill="none" marker-end="url(#ar)"/><path d="M1100 200 1100 218" stroke="#000000" stroke-width="1.5" fill="none" marker-end="url(#ar)"/><path d="M440 340 440 358" stroke="#000000" stroke-width="1.5" fill="none" marker-end="url(#ar)"/><path d="M780 440 742 440" stroke="#000000" stroke-width="1.5" fill="none" marker-end="url(#ar)"/><path d="M340 650 340 700" stroke="#000000" stroke-width="1.5" fill="none" marker-end="url(#ar)"/><path d="M760 650 760 700" stroke="#000000" stroke-width="1.5" fill="none" marker-end="url(#ar)"/><path d="M1240 650 1240 700" stroke="#000000" stroke-width="1.5" fill="none" marker-end="url(#ar)"/><rect x="60" y="700" width="440" height="740" stroke="#000000" stroke-width="1.6" fill="none"/><text fill="#000000" text-anchor="middle" transform="matrix(6.12323e-17 -1 1 6.12323e-17 -982 1158)" x="88" y="1070">ROM 层 ROM Layer</text><rect x="120" y="730" width="360" height="100" stroke="#000000" stroke-width="1" fill="none"/><text fill="#000000" font-size="13" x="136" y="756">HookLogic-X 系统内生观测底座</text><text fill="#000000" x="136" y="778">基于 AOSP 14（PixelBuilds 派生，内核 msm-4.14）</text><text fill="#000000" x="136" y="798">系统级预编译改造（内核至 TLS 库全栈改造）</text><rect x="120" y="830" width="360" height="120" stroke="#000000" stroke-width="1" fill="none"/><text fill="#000000" font-weight="700" x="136" y="858">内核 VFS 源头拦截</text><text fill="#000000" x="136" y="882">Root 隐藏 + 反调试</text><text fill="#000000" x="136" y="906">fs/namei.c · fs/readdir.c</text><text fill="#000000" x="136" y="926">fs/proc/array.c · nlmsgtab.c</text><rect x="120" y="970" width="360" height="120" stroke="#000000" stroke-width="1" fill="none"/><text fill="#000000" font-weight="700" x="136" y="998">ART 三阶段注入器</text><text fill="#000000" x="136" y="1022">zygote / early / stable 相位脱壳</text><text fill="#000000" x="136" y="1046">art/runtime/pb_agent.cc</text><text fill="#000000" x="136" y="1066">libandroid_pb_v1.so</text><rect x="120" y="1110" width="360" height="120" stroke="#000000" stroke-width="1" fill="none"/><text fill="#000000" font-weight="700" x="136" y="1138">Framework Pine Hook 通道</text><text fill="#000000" x="136" y="1162">Java 方法级 hook</text><text fill="#000000" x="136" y="1186">top.canyie.pin3</text><text fill="#000000" x="136" y="1206">boot classpath</text><rect x="120" y="1250" width="360" height="120" stroke="#000000" stroke-width="1" fill="none"/><text fill="#000000" font-weight="700" x="136" y="1278">Conscrypt TLS 密钥导出</text><text fill="#000000" x="136" y="1302">流量观测（keylog callback）</text><text fill="#000000" x="136" y="1326">native_crypto.cc</text><text fill="#000000" x="136" y="1346">SSL_CTX_set_keylog_callback</text><rect x="540" y="700" width="440" height="740" stroke="#000000" stroke-width="1.6" fill="none"/><text fill="#000000" text-anchor="middle" transform="matrix(6.12323e-17 -1 1 6.12323e-17 -502 1638)" x="568" y="1070">协作区 Collaboration</text><rect x="600" y="730" width="360" height="200" stroke="#000000" stroke-width="1" fill="none"/><text fill="#000000" x="616" y="758">黑板 (Blackboard)</text><text fill="#000000" x="616" y="784">HEARSAY-II 模式 · 状态驱动</text><text fill="#000000" x="616" y="806">workspace/&lt;pkg&gt;/</text><text fill="#000000" x="616" y="830">订阅字段变化 → 自主触发</text><text fill="#000000" x="616" y="850">故障域隔离 / 知识沉淀</text><text fill="#000000" font-weight="700" x="616" y="874">五态裁决 status.json</text><text fill="#000000" font-size="10" x="616" y="894">confirmed / pending / refuted</text><text fill="#000000" font-size="10" x="616" y="912">/ not_applicable / needs_follow_up</text><rect x="600" y="950" width="360" height="200" stroke="#000000" stroke-width="1" fill="none"/><text fill="#000000" x="616" y="978">共享论坛 (Shared Forum)</text><text fill="#000000" x="616" y="1004">契约化工具调用 · 消息驱动</text><text fill="#000000" x="616" y="1026">workspace/&lt;pkg&gt;/forum/</text><text fill="#000000" x="616" y="1050">线索广播 / 求助协调 / 反证共享</text><rect x="600" y="1170" width="360" height="160" stroke="#000000" stroke-width="1" fill="none"/><text fill="#000000" font-size="12.5" x="616" y="1196">分级汇报协议</text><text fill="#000000" font-size="10" x="616" y="1220">recon: Phase/Status/Evidence/Blocker</text><text fill="#000000" font-size="10" x="616" y="1240">vuln_agent: Component/Confidence/Evidence/Limits</text><text fill="#000000" font-size="10" x="616" y="1260">verify: Verdict/Confidence/Counter_Evidence</text><text fill="#000000" font-size="10" x="616" y="1286">Confidence 为跨角色强制字段</text><text fill="#000000" font-size="10" x="616" y="1310">PASSED → Playbook；FALSE_POSITIVE → 反模式</text><rect x="1020" y="700" width="440" height="740" stroke="#000000" stroke-width="1.6" fill="none"/><text fill="#000000" text-anchor="middle" transform="matrix(6.12323e-17 -1 1 6.12323e-17 -22 2118)" x="1048" y="1070">硬件层 Hardware</text><rect x="1080" y="730" width="360" height="140" stroke="#000000" stroke-width="1" fill="none"/><text fill="#000000" x="1096" y="758">测试设备池</text><text fill="#000000" x="1096" y="784">Pixel 4</text><text fill="#000000" x="1096" y="806">已刷 HookLogic-X 定制 ROM</text><text fill="#000000" x="1096" y="830">目标执行环境</text><rect x="1080" y="890" width="360" height="200" stroke="#000000" stroke-width="1" fill="none"/><text fill="#000000" x="1096" y="918">BLE 研究台</text><text fill="#000000" font-weight="700" x="1096" y="944">· nRF52840 Dongle × 2</text><text fill="#000000" x="1116" y="964">Nordic NCS 固件，Central / Peripheral / Observer 切换</text><text fill="#000000" font-weight="700" x="1096" y="990">· Ellisys Bluetooth Vanguard</text><text fill="#000000" x="1116" y="1010">专业空口嗅探仪（被动监听）</text><text fill="#000000" font-weight="700" x="1096" y="1036">· Google Bumble 协议栈</text><text fill="#000000" x="1116" y="1056">跨平台 BLE 控制（Python，宿主侧解析）</text><rect x="1080" y="1110" width="360" height="140" stroke="#000000" stroke-width="1" fill="none"/><text fill="#000000" x="1096" y="1138">网络设备</text><text fill="#000000" x="1096" y="1164">专用测试网络</text><text fill="#000000" x="1096" y="1186">与生产环境隔离</text><text fill="#000000" x="1096" y="1208">流量镜像 / 抓包</text></svg>