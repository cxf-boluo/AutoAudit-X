<svg width="1600" height="1550" viewBox="0 0 1600 1550" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" overflow="hidden"><defs><marker refX="7.5" refY="3" markerWidth="9" markerHeight="8" orient="auto" id="ar" overflow="hidden"><path d="M0 0 8 3 0 6Z" fill="#000000"/></marker></defs><text fill="#000000" text-anchor="middle" x="800" y="46">BLE 车辆钥匙三类攻击路径</text><text fill="#000000" text-anchor="middle" x="800" y="74">Replay · Relay · Protocol Flaw Exploitation（同源侦察 → 三条并列路径 → 判定）</text><rect x="60" y="100" width="1480" height="240" stroke="#000000" stroke-width="1.6" fill="none"/><text fill="#000000" x="84" y="132">侦察：协议情报收集</text><text fill="#000000" x="84" y="154">Recon — feeds all three paths</text><rect x="90" y="170" width="470" height="150" stroke="#000000" stroke-width="1" fill="none"/><text fill="#000000" x="106" y="196">App 逆向分析</text><text fill="#000000" x="106" y="220">协议帧格式 / UUID / handle 表</text><text fill="#000000" x="106" y="244">加密流程（CBC / ECDH / GCM）</text><text fill="#000000" font-weight="700" x="106" y="268">→ 缺陷画像：协商可降级 / nonce 生成 / 密钥派生</text><text fill="#000000" x="106" y="296">产出服务路径③</text><rect x="570" y="170" width="470" height="150" stroke="#000000" stroke-width="1" fill="none"/><text fill="#000000" x="586" y="196">蓝牙帧捕获分析</text><text fill="#000000" x="586" y="220">Ellisys 空口 / Bumble HCI snoop</text><text fill="#000000" x="586" y="244">广播载荷（厂商 ID / 会话种子 / 设备指纹）</text><text fill="#000000" x="586" y="268">会话帧序列（无配对时明文可见）</text><text fill="#000000" x="586" y="296">产出服务路径①②，配合 App 逆向发现缺陷</text><rect x="1050" y="170" width="460" height="150" stroke="#000000" stroke-width="1" fill="none"/><text fill="#000000" x="1066" y="196">侦察产出</text><text fill="#000000" x="1066" y="220">广播格式 / 会话种子 → 密钥派生</text><text fill="#000000" x="1066" y="244">GATT handle / 指令语义</text><text fill="#000000" x="1066" y="268">车端忙/活窗画像（占空比 / 拒绝码）</text><text fill="#000000" x="1066" y="296">缺陷清单：无 freshness？协商可降级？nonce 重用？</text><path d="M290 340 290 390" stroke="#000000" stroke-width="1.5" fill="none" marker-end="url(#ar)"/><path d="M800 340 800 390" stroke="#000000" stroke-width="1.5" fill="none" marker-end="url(#ar)"/><path d="M1310 340 1310 390" stroke="#000000" stroke-width="1.5" fill="none" marker-end="url(#ar)"/><text fill="#000000" x="306" y="372">路径①</text><text fill="#000000" x="816" y="372">路径②</text><text fill="#000000" x="1326" y="372">路径③</text><rect x="60" y="390" width="460" height="480" stroke="#000000" stroke-width="1.6" fill="none"/><text fill="#000000" x="84" y="422">路径①：重放</text><text fill="#000000" x="84" y="444">Replay — 无会话绑定时最简单</text><rect x="90" y="460" width="400" height="130" stroke="#000000" stroke-width="1" fill="none"/><text fill="#000000" x="106" y="486">前提</text><text fill="#000000" x="106" y="510">协议帧无 nonce / 计数器 / 时间戳绑定</text><text fill="#000000" x="106" y="532">或无配对加密（未启用 LE Secure Connections）</text><text fill="#000000" x="106" y="556">由侦察期判定</text><rect x="90" y="610" width="400" height="170" stroke="#000000" stroke-width="1" fill="none"/><text fill="#000000" x="106" y="636">动作</text><text fill="#000000" x="106" y="660">Bumble 解析侦获帧 → 提取 GATT 写入语义</text><text fill="#000000" x="106" y="684">例：handle=X, value=unlock()</text><text fill="#000000" x="106" y="708">dongle 作 Central 直连车辆，原帧重发</text><text fill="#000000" x="106" y="732">replay(handle, value) → 车辆</text><text fill="#000000" x="106" y="760">无需伪造会话——沿用原帧原链路语义</text><rect x="90" y="800" width="400" height="50" stroke="#000000" stroke-width="1" fill="none"/><text fill="#000000" font-weight="700" x="106" y="820">车辆执行 → 缺 freshness 保护</text><text fill="#000000" x="106" y="838">被拒 → 进入路径③查加密缺陷</text><rect x="570" y="390" width="460" height="480" stroke="#000000" stroke-width="1.6" fill="none"/><text fill="#000000" x="594" y="422">路径②：中继</text><text fill="#000000" x="594" y="444">Relay — 免疫应用层加密</text><rect x="600" y="460" width="400" height="110" stroke="#000000" stroke-width="1" fill="none"/><text fill="#000000" x="616" y="486">前提</text><text fill="#000000" x="616" y="510">目标 App 是扫描型（靠广播找车）</text><text fill="#000000" x="616" y="532">重连型 App 需克隆车辆地址 + 抢连接</text><text fill="#000000" x="616" y="554">由侦察期判定</text><rect x="600" y="590" width="400" height="200" stroke="#000000" stroke-width="1" fill="none"/><text fill="#000000" x="616" y="616">动作（双 dongle 双向转发）</text><text fill="#000000" x="616" y="640">nRF#2 作 Peripheral：克隆车辆广播，诱骗手机</text><text fill="#000000" x="616" y="664">nRF#1 作 Central：连接真实车辆</text><text fill="#000000" x="616" y="688">转发应用层 PDU——逐跳重加密：</text><text fill="#000000" x="616" y="710">手机 ↔ #2 一条 LTK / #1 ↔ 车 另一条 LTK</text><text fill="#000000" x="616" y="734">挑战-响应原样转译，端到端密文穿透</text><text fill="#000000" x="616" y="760">应用层加密再强也无效——这是中继的本质</text><text fill="#000000" x="616" y="782">Ellisys 实时捕获两跳，验证转发成功</text><rect x="600" y="800" width="400" height="50" stroke="#000000" stroke-width="1" fill="none"/><text fill="#000000" font-weight="700" x="616" y="820">链路建立且功能完整 → 缺物理邻近绑定</text><text fill="#000000" x="616" y="838">（无 UWB 测距 / 无强绑定 RSSI 阈值）</text><rect x="1080" y="390" width="460" height="480" stroke="#000000" stroke-width="1.6" fill="none"/><text fill="#000000" x="1104" y="422">路径③：协议缺陷利用</text><text fill="#000000" x="1104" y="444">Protocol Flaw Exploitation — 假想示例：KNOB 类降级 + nonce 管理失误</text><rect x="1110" y="460" width="400" height="110" stroke="#000000" stroke-width="1" fill="none"/><text fill="#000000" x="1126" y="486">前提（假想缺陷组合）</text><text fill="#000000" x="1126" y="510">协议设计允许协商阶段被中间人降级</text><text fill="#000000" x="1126" y="532">（如 CVE-2019-9506 类：密钥长度协商无绑定）</text><text fill="#000000" x="1126" y="554">实现层 nonce 生成 / 密钥派生存在缺陷</text><rect x="1110" y="590" width="400" height="200" stroke="#000000" stroke-width="1" fill="none"/><text fill="#000000" x="1126" y="616">动作（密码学攻击）</text><text fill="#000000" x="1126" y="640">扫广播 + 触发握手 → 收集密文对</text><text fill="#000000" x="1126" y="664">忙窗期密集重掷建链，反复诱导车端发起协商</text><text fill="#000000" x="1126" y="688">中间人强制协商降级 → 穷举小密钥空间</text><text fill="#000000" x="1126" y="712">nonce 重用 → 已知明文 XOR 恢复密钥流</text><text fill="#000000" x="1126" y="736">GHASH H 因式分解 → 伪造认证 tag</text><text fill="#000000" x="1126" y="760">解出会话密钥 → 伪造合法帧（探针 → 解锁 → 上锁）</text><text fill="#000000" x="1126" y="782">既是协议设计缺陷，也是实现层缺陷——二者结合才致命</text><rect x="1110" y="800" width="400" height="50" stroke="#000000" stroke-width="1" fill="none"/><text fill="#000000" font-weight="700" x="1126" y="820">解锁成功 → 协商无绑定 + nonce 唯一性失效</text><text fill="#000000" x="1126" y="838">链路加密再强也无法防——协商与实现层缺陷击穿 AEAD 假设</text><path d="M290 870 290 920 800 920 800 960" stroke="#000000" stroke-width="1.5" fill="none" marker-end="url(#ar)"/><path d="M800 870 800 960" stroke="#000000" stroke-width="1.5" fill="none" marker-end="url(#ar)"/><path d="M1310 870 1310 920 800 920 800 960" stroke="#000000" stroke-width="1.5" fill="none" marker-end="url(#ar)"/><rect x="420" y="960" width="760" height="200" stroke="#000000" stroke-width="1.6" fill="none"/><text fill="#000000" text-anchor="middle" x="800" y="992">判定与产物</text><text fill="#000000" text-anchor="middle" x="800" y="1020">任一路径成立 → 漏洞确认，写入 Playbook</text><text fill="#000000" x="440" y="1054">① 重放成立 → 缺陷：无 freshness 保护（缺 nonce / 计数器 / 时间戳）</text><text fill="#000000" x="440" y="1080">② 中继成立 → 缺陷：无物理邻近绑定（缺 UWB 测距 / RSSI 强制阈值）</text><text fill="#000000" x="440" y="1106">③ 缺陷利用成立 → 协议层：协商无绑定（KNOB 类）；实现层：nonce 重用 / 密钥派生缺陷</text><text fill="#000000" text-anchor="middle" x="800" y="1140">三条路径互为补充——协议加密强度只影响①，无法阻止②③</text><text fill="#000000" font-size="11" text-anchor="middle" x="800" y="1230">硬件复用：Ellisys 全程观测；nRF52840 #1 在 Observer / Central 间切换，#2 在需要时作 Peripheral 靶机</text><text fill="#000000" font-size="11" text-anchor="middle" x="800" y="1254">工具栈：Bumble 协议栈脚本化驱动 · AOSP 定制 ROM 提供 App 侧 HookLogic-X 观测原语</text><rect x="60" y="1300" width="480" height="130" stroke="#000000" stroke-width="1" fill="none"/><text fill="#000000" x="80" y="1330">图例</text><line x1="80" y1="1356" x2="130" y2="1356" stroke="#000000" stroke-width="1.5" fill="none" marker-end="url(#ar)"/><text fill="#000000" x="142" y="1360">实线箭头：控制流 / 数据流</text><line x1="80" y1="1388" x2="130" y2="1388" stroke="#000000" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="2 4" fill="none"/><text fill="#000000" x="142" y="1392">点线：观测（不干预）</text></svg>