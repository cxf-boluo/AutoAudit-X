<svg width="1200" height="1300" viewBox="0 0 1200 1300" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" overflow="hidden"><defs><marker refX="7.5" refY="3" markerWidth="9" markerHeight="8" orient="auto" id="ar" overflow="hidden"><path d="M0 0 8 3 0 6Z" fill="#000000"/></marker></defs><text fill="#000000" text-anchor="middle" x="600" y="48">AX 智能体层工作流：从侦察到裁决</text><rect x="200" y="80" width="800" height="130" stroke="#000000" stroke-width="1.6" fill="none"/><text fill="#000000" font-size="15" x="220" y="112">Brain (Orchestrator)</text><text fill="#000000" x="220" y="140">池调度（动态扩缩 vuln_agent）</text><text fill="#000000" x="220" y="162">资源仲裁（adb、BLE 全局互斥锁）</text><text fill="#000000" x="220" y="184">反思复盘</text><path d="M600 210 600 250" stroke="#000000" stroke-width="1.5" fill="none" marker-end="url(#ar)"/><rect x="200" y="250" width="800" height="150" stroke="#000000" stroke-width="1" fill="none"/><text fill="#000000" x="220" y="282">recon <tspan fill="#000000" font-weight="400">（前置侦察，单实例串行）</tspan></text><text fill="#000000" x="220" y="310">Phase 1 加固识别 → Phase 2 脱壳 + 反编译 + 产物落盘</text><text fill="#000000" x="220" y="338">产出：<tspan fill="#000000">workspace/&lt;pkg&gt;/</tspan> 代码基线 / Manifest / 资源文件</text><text fill="#000000" x="220" y="362">为后续 vuln_agent 提供事实基础</text><path d="M600 400 600 440" stroke="#000000" stroke-width="1.5" fill="none" marker-end="url(#ar)"/><text fill="#000000" x="615" y="425">Brain 按组件数量启动 vuln_agent 池</text><rect x="200" y="440" width="800" height="280" stroke="#000000" stroke-width="1.6" fill="none"/><text fill="#000000" x="220" y="472">vuln_agent_1..N <tspan fill="#000000" font-weight="400">（弹性 worker 池）</tspan></text><rect x="220" y="490" width="760" height="56" stroke="#000000" stroke-width="1" fill="none"/><text fill="#000000" x="236" y="514">vuln_agent_1 + toolkit_1</text><text fill="#000000" x="236" y="534">→ Component_A</text><rect x="220" y="556" width="760" height="56" stroke="#000000" stroke-width="1" fill="none"/><text fill="#000000" x="236" y="580">vuln_agent_2 + toolkit_2</text><text fill="#000000" x="236" y="600">→ Component_B</text><rect x="220" y="622" width="760" height="56" stroke="#000000" stroke-width="1" fill="none"/><text fill="#000000" x="236" y="646">vuln_agent_N + toolkit_N</text><text fill="#000000" x="236" y="666">→ Component_N</text><text fill="#000000" x="220" y="702">worker 间互不感知；toolkit 实例独占；adb/BLE 由 Brain 仲裁</text><path d="M600 720 600 760" stroke="#000000" stroke-width="1.5" fill="none" marker-end="url(#ar)"/><text fill="#000000" x="615" y="745">每 worker 完成审计后</text><rect x="200" y="760" width="800" height="150" stroke="#000000" stroke-width="1" fill="none"/><text fill="#000000" x="220" y="792">verify <tspan fill="#000000" font-weight="400">（独立实例，三层隔离）</tspan></text><text fill="#000000" x="220" y="820">信息隔离（盲验） / 视角隔离（开发者 · 攻击者 · 对抗） / 模型隔离（异构对抗）</text><text fill="#000000" x="220" y="848">对 vuln_agent 结论独立复核，屏蔽原始推理轨迹，仅看证据</text><text fill="#000000" x="220" y="872">防止确认偏误与循环论证</text><path d="M600 910 600 950" stroke="#000000" stroke-width="1.5" fill="none" marker-end="url(#ar)"/><rect x="200" y="950" width="800" height="280" stroke="#000000" stroke-width="1.6" fill="none"/><text fill="#000000" font-size="15" x="220" y="982">裁决 (Verdict)</text><rect x="220" y="1000" width="760" height="56" stroke="#000000" stroke-width="1" fill="none"/><text fill="#000000" font-weight="700" x="236" y="1026">PASSED</text><text fill="#000000" x="236" y="1046">→ 写入漏洞库</text><rect x="220" y="1066" width="760" height="56" stroke="#000000" stroke-width="1" fill="none"/><text fill="#000000" font-weight="700" x="236" y="1092">FALSE_POSITIVE</text><text fill="#000000" x="236" y="1112">→ 回滚，记录误判案例（反哺 Brain 反思）</text><rect x="220" y="1132" width="760" height="56" stroke="#000000" stroke-width="1" fill="none"/><text fill="#000000" font-weight="700" x="236" y="1158">NEED_MORE_INFO</text><text fill="#000000" x="236" y="1178">→ 反馈对应 worker 补充证据</text><path d="M980 1160 1100 1160 1100 580 982 580" stroke="#000000" stroke-width="1.5" fill="none" marker-end="url(#ar)"/><text fill="#000000" text-anchor="middle" transform="matrix(6.12323e-17 -1 1 6.12323e-17 232 1952)" x="1092" y="860">反馈补充证据</text><path d="M220 1094 140 1094 140 140 200 140" stroke="#000000" stroke-width="1.5" fill="none" marker-end="url(#ar)"/><text fill="#000000" text-anchor="middle" transform="matrix(6.12323e-17 -1 1 6.12323e-17 -470 730)" x="130" y="600">误判案例回流</text></svg>